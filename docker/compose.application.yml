networks:
  platform:
    external: true
    name: ${RAY_NETWORK_NAME:?RAY_NETWORK_NAME is required}

x-runtime: &runtime
  env_file:
    - ${RAY_RUNTIME_ENV_FILE:?RAY_RUNTIME_ENV_FILE is required}
  networks: [platform]
  pull_policy: never
  restart: unless-stopped
  labels:
    io.ray.release.id: ${RAY_RELEASE_ID:?RAY_RELEASE_ID is required}
    io.ray.release.sha: ${RAY_RELEASE_SHA:?RAY_RELEASE_SHA is required}

services:
  engine:
    <<: *runtime
    image: ${ENGINE_IMAGE:?ENGINE_IMAGE must be an immutable digest}
    expose: ['8000']
    environment:
      NODE_ENV: production
      ENGINE_PORT: 8000
      REDIS_HOST: redis
      MONGO_HOST: mongo
      POSTGRES_HOST: postgres
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8000/api/v1/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  pulse:
    <<: *runtime
    image: ${PULSE_IMAGE:?PULSE_IMAGE must be an immutable digest}
    expose: ['3001']
    environment:
      NODE_ENV: production
      PULSE_PORT: 3001
      REDIS_HOST: redis
      MONGO_HOST: mongo
      POSTGRES_HOST: postgres
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3001/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *runtime
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be an immutable digest}
    expose: ['3002']
    environment:
      NODE_ENV: production
      WORKER_PORT: 3002
      WORKER_RUNTIME_MODE: ${WORKER_RUNTIME_MODE:-active}
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-platform-worker-v1}
      WORKER_ROUTING_KEY: ${WORKER_ROUTING_KEY:-platform.worker.v1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3002/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  web:
    <<: *runtime
    image: ${WEB_IMAGE:?WEB_IMAGE must be an immutable digest}
    expose: ['3000']
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kong:
    image: ${KONG_IMAGE:?KONG_IMAGE must be an immutable digest}
    pull_policy: never
    networks: [platform]
    ports:
      - ${RAY_HTTP_PORT:-80}:8000
      - ${RAY_HTTPS_PORT:-443}:8443
    entrypoint: ['/entrypoint.sh']
    env_file:
      - ${RAY_RUNTIME_ENV_FILE:?RAY_RUNTIME_ENV_FILE is required}
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 'off'
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_TRUSTED_IPS: 0.0.0.0/0
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: 'on'
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml.template:ro
      - ./kong/entrypoint.sh:/entrypoint.sh:ro
    restart: unless-stopped
    labels:
      io.ray.release.id: ${RAY_RELEASE_ID:?RAY_RELEASE_ID is required}
      io.ray.release.sha: ${RAY_RELEASE_SHA:?RAY_RELEASE_SHA is required}
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
