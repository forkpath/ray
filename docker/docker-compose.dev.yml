networks:
  ray-net:
    external: false
    driver: bridge

services:
  # ═══════════════════════════════════════════════════════════════
  #  Infrastructure
  # ═══════════════════════════════════════════════════════════════

  redis:
    image: docker.io/library/redis:7.4@sha256:33d7c9a245edd95e6703a0addbeaa48fe40c3b3b4783627a72085155462ebfdb
    container_name: ${RAY_DEV_NAMESPACE:-ray}-redis
    networks: [ray-net]
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes', '--tcp-keepalive', '60']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: docker.io/library/postgres:17@sha256:2203e6282d9e7de7c24d7da234e2a744fb325df366a3fd8ed940e8abbee39527
    container_name: ${RAY_DEV_NAMESPACE:-ray}-postgres
    networks: [ray-net]
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: docker.io/library/mongo:8.0@sha256:45b422ba19c0f028a917ea43746ab8e8cdbdaaeb50d2e6e634a17c59666e0dbb
    container_name: ${RAY_DEV_NAMESPACE:-ray}-mongo
    networks: [ray-net]
    ports: ['127.0.0.1:${MONGO_PORT:-27017}:27017']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      # Linux 6.19+ breaks TCMalloc's per-CPU caches (SERVER-121912), and MongoDB 8 then
      # refuses to start. The image sets rseq=0 so TCMalloc can use them; rseq=1 lets glibc own
      # rseq, which turns the per-CPU caches off on every kernel at a small throughput cost.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongo:/data/db
      - ./mongo/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: docker.io/library/rabbitmq:4.0.1-management@sha256:9b471f8528a5beee7a6913d49bc450ffd92b3d0d9732f8febc448d291f5d150b
    container_name: ${RAY_DEV_NAMESPACE:-ray}-rabbitmq
    networks: [ray-net]
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD}
      # Share laptop CPUs with TypeScript/Vite instead of starting one scheduler
      # per Docker VM CPU. Deployment sizing remains in the infra Compose file.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '${RABBITMQ_DEV_ERL_ARGS:-+S 2:2 +A 4 +sbwt none +sbwtdcpu none +sbwtdio none}'
      RABBITMQ_CTL_ERL_ARGS: '+S 1:1 +A 1'
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      # A root probe can create an unreadable cookie before the broker starts.
      test: ['CMD', 'gosu', 'rabbitmq', 'rabbitmq-diagnostics', '-q', 'ping']
      # The CLI boots its own VM; first-time app compilation shares laptop CPUs.
      interval: 30s
      timeout: 15s
      retries: 5

  kong:
    image: docker.io/library/kong:3.9@sha256:12972ce1ab6396083e56e7d46fce084836c98cc819344bef44a1f583ec3ab191
    networks: [ray-net]
    ports: ['${GATEWAY_DEV_PORT:-8080}:8000']
    extra_hosts: ['host.docker.internal:host-gateway']
    entrypoint: ['/entrypoint.sh']
    environment:
      KONG_DATABASE: 'off'
      # Compose names have A records; SRV lookups can fall through to public DNS.
      KONG_DNS_ORDER: LAST,A,CNAME
      # Vite serves hundreds of source modules per page in development.
      KONG_RATE_LIMIT_MINUTE: ${KONG_DEV_RATE_LIMIT_MINUTE:-10000}
      KONG_NGINX_WORKER_PROCESSES: ${KONG_WORKERS:-2}
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ADMIN_LISTEN: 'off'
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      PUBLIC_ORIGIN: http://localhost:${GATEWAY_DEV_PORT:-8080}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENGINE_UPSTREAM: host.docker.internal:${ENGINE_PORT:-8000}
      PULSE_UPSTREAM: host.docker.internal:${PULSE_PORT:-3001}
      WEB_UPSTREAM: host.docker.internal:${WEB_PORT:-3000}
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml.template:ro
      - ./kong/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis:
    name: ${RAY_DEV_NAMESPACE:-ray}-redis
  postgres:
    name: ${RAY_DEV_NAMESPACE:-ray}-postgres
  mongo:
    name: ${RAY_DEV_NAMESPACE:-ray}-mongo
  rabbitmq:
    name: ${RAY_DEV_NAMESPACE:-ray}-rabbitmq
