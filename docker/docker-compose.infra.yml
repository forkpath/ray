name: ${COMPOSE_PROJECT_NAME:-ray}

networks:
  ray-net:
    driver: bridge

services:
  redis:
    image: docker.io/library/redis:7.4@sha256:33d7c9a245edd95e6703a0addbeaa48fe40c3b3b4783627a72085155462ebfdb
    networks: [ray-net]
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes: [redis:/data]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: docker.io/library/postgres:17@sha256:2203e6282d9e7de7c24d7da234e2a744fb325df366a3fd8ed940e8abbee39527
    networks: [ray-net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: docker.io/library/mongo:8.0@sha256:45b422ba19c0f028a917ea43746ab8e8cdbdaaeb50d2e6e634a17c59666e0dbb
    networks: [ray-net]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      # Linux 6.19+ breaks TCMalloc's per-CPU caches (SERVER-121912), and MongoDB 8 then
      # refuses to start. The image sets rseq=0 so TCMalloc can use them; rseq=1 lets glibc own
      # rseq, which turns the per-CPU caches off on every kernel at a small throughput cost.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongo:/data/db
      - ./mongo/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: docker.io/library/rabbitmq:4.0.1-management@sha256:9b471f8528a5beee7a6913d49bc450ffd92b3d0d9732f8febc448d291f5d150b
    networks: [ray-net]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD}
      # Keep readiness probes small without limiting broker schedulers.
      RABBITMQ_CTL_ERL_ARGS: '+S 1:1 +A 1'
    volumes: [rabbitmq:/var/lib/rabbitmq]
    restart: unless-stopped
    healthcheck:
      # A root probe can create an unreadable cookie before the broker starts.
      test: ['CMD', 'gosu', 'rabbitmq', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s

  kong:
    image: docker.io/library/kong:3.9@sha256:12972ce1ab6396083e56e7d46fce084836c98cc819344bef44a1f583ec3ab191
    networks: [ray-net]
    ports: ['${GATEWAY_HTTP_PORT:-80}:8000', '${GATEWAY_HTTPS_PORT:-443}:8443']
    entrypoint: ['/entrypoint.sh']
    environment:
      KONG_DATABASE: 'off'
      # Compose names have A records; SRV lookups can fall through to public DNS.
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_NGINX_WORKER_PROCESSES: ${KONG_WORKERS:-2}
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ADMIN_LISTEN: 'off'
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      # ACME's cross-signed chain can exceed Kong's default depth of one.
      # Keep system CA verification enabled while allowing up to three intermediates.
      KONG_LUA_SSL_VERIFY_DEPTH: '3'
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENGINE_UPSTREAM: engine:8000
      PULSE_UPSTREAM: pulse:3001
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      REDIS_HOST: redis
      KONG_AUTO_TLS: ${KONG_AUTO_TLS:-false}
      WEB_UPSTREAM: web:3000
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml.template:ro
      - ./kong/entrypoint.sh:/entrypoint.sh:ro
      - ./kong/tls-plugins.yml:/etc/kong/tls-plugins.yml.template:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis:
  postgres:
  mongo:
  rabbitmq:
