_format_version: '3.0'
_transform: true

services:
  # ─── Engine (NestJS API) ──────────────────────────────────────
  - name: engine-api
    url: http://engine-${RAY_ACTIVE_COLOR}:8000
    routes:
      - name: engine-api-route
        paths:
          - /api
        strip_path: false
        preserve_host: true
        protocols:
          - http
          - https
    plugins:
      - name: cors
        config:
          origins:
            - https://${DOMAIN}
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Content-Type
            - Authorization
            - Accept
            - Cookie
          credentials: true
          max_age: 3600

  # ─── Auth (Better Auth via Engine) ────────────────────────────
  - name: engine-auth
    url: http://engine-${RAY_ACTIVE_COLOR}:8000
    routes:
      - name: engine-auth-route
        paths:
          - /api/auth
        strip_path: false
        preserve_host: true
        protocols:
          - http
          - https

  # ─── Pulse (authenticated Socket.IO transport) ───────────────
  - name: pulse-websocket
    url: http://pulse-${RAY_ACTIVE_COLOR}:3001
    routes:
      - name: pulse-websocket-route
        paths:
          - /pulse/socket.io
        strip_path: false
        preserve_host: true
        protocols:
          - http
          - https

  # ─── Web (TanStack Start SSR + SPA) ──────────────────────────
  - name: web-ssr
    url: http://web-${RAY_ACTIVE_COLOR}:3000
    routes:
      - name: web-catch-all
        paths:
          - /
        strip_path: false
        preserve_host: true
        protocols:
          - http
          - https

plugins:
  # ─── Let's Encrypt auto SSL ──────────────────────────────────
  - name: acme
    config:
      account_email: ${ACME_EMAIL}
      api_uri: https://acme-v02.api.letsencrypt.org
      tos_accepted: true
      domains:
        - ${DOMAIN}
        - www.${DOMAIN}
      storage: redis
      storage_config:
        redis:
          host: redis
          port: 6379
          auth: ${REDIS_PASSWORD}
          database: 1
      cert_type: rsa
      rsa_key_size: 2048
      renew_threshold_days: 30

  # ─── HTTP → HTTPS + www → apex redirect ─────────────────────
  - name: pre-function
    config:
      access:
        - |
          local scheme = kong.request.get_scheme()
          local host = kong.request.get_host()
          local path = kong.request.get_path()
          local uri = kong.request.get_path_with_query()
          local is_www = host:find("^www%.", 1) ~= nil
          local is_http = scheme == "http"
          if is_http and path:find("/.well-known/acme-challenge", 1, true) then
            return
          end
          if is_http or is_www then
            local target = host
            if is_www then
              target = host:sub(5)
            end
            return kong.response.exit(301, nil, {
              ["Location"] = "https://" .. target .. uri
            })
          end

  # ─── Rate limiting ───────────────────────────────────────────
  - name: rate-limiting
    config:
      minute: 200
      policy: redis
      redis:
        host: redis
        port: 6379
        password: ${REDIS_PASSWORD}
        database: 2
      fault_tolerant: true
      hide_client_headers: false
