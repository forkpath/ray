networks:
  ray-net:
    external: false
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/16
          gateway: 10.10.0.1

services:
  # ═══════════════════════════════════════════════════════════════
  #  Infrastructure
  # ═══════════════════════════════════════════════════════════════

  redis:
    image: redis:7.4
    container_name: ray-redis
    networks: [ray-net]
    ports: ['6379:6379']
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes', '--tcp-keepalive', '60']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17
    container_name: ray-postgres
    networks: [ray-net]
    ports: ['5432:5432']
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:8.0
    container_name: ray-mongo
    networks: [ray-net]
    ports: ['27017:27017']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo:/data/db
      - ./mongo/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0.1-management
    container_name: ray-rabbitmq
    networks: [ray-net]
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  #  Application
  # ═══════════════════════════════════════════════════════════════

  engine:
    build:
      context: ..
      dockerfile: docker/engine.Dockerfile
    image: ray-engine:${IMAGE_TAG:-latest}
    container_name: ray-engine
    networks: [ray-net]
    expose: ['8000']
    env_file: ../.env
    environment:
      NODE_ENV: production
      ENGINE_PORT: 8000
      REDIS_HOST: redis
      MONGO_HOST: mongo
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connect_timeout=300&sslmode=disable
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASSWORD}@rabbitmq:5672
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-elasticsearch}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8000/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  pulse:
    build:
      context: ..
      dockerfile: docker/pulse.Dockerfile
    image: ray-pulse:${IMAGE_TAG:-latest}
    container_name: ray-pulse
    networks: [ray-net]
    expose: ['3001']
    env_file: ../.env
    environment:
      NODE_ENV: production
      PULSE_PORT: 3001
      REDIS_HOST: redis
      MONGO_HOST: mongo
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connect_timeout=300&sslmode=disable
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASSWORD}@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    image: ray-worker:${IMAGE_TAG:-latest}
    container_name: ray-worker
    networks: [ray-net]
    env_file: ../.env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      MONGO_HOST: mongo
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connect_timeout=300&sslmode=disable
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASSWORD}@rabbitmq:5672
      WORKER_PROCESSORS: ${WORKER_PROCESSORS:-all}
      WORKER_QUEUES: ${WORKER_QUEUES:-jobs.ingestion.worker}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: ray-web:${IMAGE_TAG:-latest}
    container_name: ray-web
    networks: [ray-net]
    expose: ['3000']
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════
  #  API Gateway
  # ═══════════════════════════════════════════════════════════════

  kong:
    image: kong:3.9
    container_name: ray-kong
    networks: [ray-net]
    ports:
      - '80:8000'
      - '443:8443'
      - '8001:8001'
    entrypoint: ['/entrypoint.sh']
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_TRUSTED_IPS: 0.0.0.0/0
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: 'on'
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml.template:ro
      - ./kong/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
      engine:
        condition: service_healthy
      pulse:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Konga (Kong Admin UI) ─────────────────────────────────────
  konga:
    image: pantsel/konga:latest
    container_name: ray-konga
    networks: [ray-net]
    ports: ['1337:1337']
    environment:
      NODE_ENV: production
      TOKEN_SECRET: ${KONGA_TOKEN_SECRET:-ray-konga-secret}
    depends_on:
      kong:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis:
    name: ray-redis
  postgres:
    name: ray-postgres
  mongo:
    name: ray-mongo
  rabbitmq:
    name: ray-rabbitmq
