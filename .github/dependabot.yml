version: 2

updates:
  # pnpm's root lockfile covers every workspace importer and the catalogs.
  # Public npm uses the default registry; custom registries require credentials.
  - package-ecosystem: npm
    directory: /
    # Dependency updates enter through dev like every other change (branch-workflow.md).
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      nx-toolchain:
        patterns: ['nx', '@nx/*', '@nrwl/*']
      expo-react-native:
        patterns:
          [
            'expo',
            'expo-*',
            '@expo/*',
            'babel-preset-expo',
            'react',
            'react-dom',
            'react-native',
            'react-native-*',
            '@react-native/*',
            '@react-native-*/*',
            '@rn-primitives/*',
            'jest-expo',
            'uniwind',
            'zeego'
          ]
      auth:
        patterns: ['auth', 'better-auth', '@better-auth/*']
      electron-toolchain:
        patterns: ['electron', 'electron-builder', 'electron-updater', '@electron/*', '@sentry/electron']
        update-types: [minor, patch]
      prisma:
        patterns: ['prisma', '@prisma/*']
      web-toolchain:
        patterns: ['vite', '@vitejs/*', 'vitest', '@vitest/*', 'wxt', '@wxt-dev/*', '@tanstack/*']
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    # Dependency updates enter through dev like every other change (branch-workflow.md).
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
