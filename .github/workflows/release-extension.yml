name: Release Extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  actions: read
  contents: write

jobs:
  verify-release-ref:
    runs-on: ubuntu-24.04
    steps:
      - name: Require a version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          [[ "$RELEASE_REF" == refs/tags/v* ]] || { echo 'Select a v* tag when dispatching an extension release'; exit 1; }

  quality-gate:
    needs: verify-release-ref
    # Reusable CI declares this capability for dev deployment; tag runs skip it.
    # Must grant at least CI's top-level permissions, or the called run fails to start.
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
      full: true

  build-and-release-extension:
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: 'true'
      VITE_PRODUCT_NAME: ${{ vars.VITE_PRODUCT_NAME }}
      VITE_URL: ${{ vars.VITE_URL }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_DEFAULT_LOCALE: ${{ vars.VITE_DEFAULT_LOCALE }}
      VITE_THEME_MODE: ${{ vars.VITE_THEME_MODE }}
      VITE_THEME_COLOR: ${{ vars.VITE_THEME_COLOR }}
      VITE_ANALYTICS_PROVIDER: ${{ vars.VITE_ANALYTICS_PROVIDER }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      VITE_MONITORING_PROVIDER: ${{ vars.VITE_MONITORING_PROVIDER }}
      VITE_SENTRY_EXTENSION_DSN: ${{ vars.VITE_SENTRY_EXTENSION_DSN }}
      VITE_SENTRY_ENVIRONMENT: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Validate required extension variables
        env:
          VITE_PRODUCT_NAME: ${{ vars.VITE_PRODUCT_NAME }}
          VITE_URL: ${{ vars.VITE_URL }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail

          required=(
            VITE_PRODUCT_NAME
            VITE_URL
            VITE_API_BASE_URL
          )

          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository variables: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension packages
        run: |
          pnpm nx run extension:build-chrome
          pnpm nx run extension:build-firefox

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find apps/extension/build -maxdepth 1 -type f -name '*.zip' -print -exec cp {} artifacts/ \;
          if [ -z "$(ls -A artifacts)" ]; then
            echo '::error::No extension zip artifacts found after build'
            exit 1
          fi
          ls -la artifacts

      - name: Load the exact Chromium release archive
        run: |
          set -euo pipefail
          mapfile -t packages < <(find artifacts -maxdepth 1 -type f -name '*chrome*.zip')
          test "${#packages[@]}" -eq 1
          mkdir -p dist/extension-release
          unzip -q "${packages[0]}" -d dist/extension-release
          test -f dist/extension-release/manifest.json
          (cd artifacts && sha256sum -- *.zip > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > artifacts/COMMIT
          echo "EXTENSION_BUILD_DIR=$GITHUB_WORKSPACE/dist/extension-release" >> "$GITHUB_ENV"

      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify the archive before publishing
        run: xvfb-run --auto-servernum pnpm nx run extension:e2e-artifact

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: extension-release-verification
          path: |
            dist/test-results/extension
            artifacts
          if-no-files-found: warn

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/COMMIT
          generate_release_notes: true
