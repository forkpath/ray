name: Release Extension

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build-and-release-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require a production tag from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo '::error::Extension releases require a v* production tag'
            exit 1
          fi
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo '::error::Production tags must point to a commit on main'
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.25.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Validate required extension variables
        env:
          VITE_PRODUCT_NAME: ${{ vars.VITE_PRODUCT_NAME }}
          VITE_URL: ${{ vars.VITE_URL }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail

          required=(
            VITE_PRODUCT_NAME
            VITE_URL
            VITE_API_BASE_URL
          )

          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository variables: ${missing[*]}"
            exit 1
          fi

      - name: Create extension env files (.env/.env.development/.env.production)
        run: |
          cat > apps/extension/.env <<EOF
          VITE_PRODUCT_NAME=${{ vars.VITE_PRODUCT_NAME }}
          VITE_URL=${{ vars.VITE_URL }}
          VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          VITE_DEFAULT_LOCALE=${{ vars.VITE_DEFAULT_LOCALE }}
          VITE_THEME_MODE=${{ vars.VITE_THEME_MODE }}
          VITE_THEME_COLOR=${{ vars.VITE_THEME_COLOR }}
          VITE_ANALYTICS_PROVIDER=${{ vars.VITE_ANALYTICS_PROVIDER }}
          VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
          VITE_MONITORING_PROVIDER=${{ vars.VITE_MONITORING_PROVIDER }}
          VITE_SENTRY_EXTENSION_DSN=${{ vars.VITE_SENTRY_EXTENSION_DSN }}
          VITE_SENTRY_ENVIRONMENT=production
          EOF

          cp apps/extension/.env apps/extension/.env.development
          cp apps/extension/.env apps/extension/.env.production

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh apps/extension/.env.production
        run: |
          cat > apps/extension/.env.production <<EOF
          VITE_PRODUCT_NAME=${{ vars.VITE_PRODUCT_NAME }}
          VITE_URL=${{ vars.VITE_URL }}
          VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          VITE_DEFAULT_LOCALE=${{ vars.VITE_DEFAULT_LOCALE }}
          VITE_THEME_MODE=${{ vars.VITE_THEME_MODE }}
          VITE_THEME_COLOR=${{ vars.VITE_THEME_COLOR }}
          VITE_ANALYTICS_PROVIDER=${{ vars.VITE_ANALYTICS_PROVIDER }}
          VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
          VITE_MONITORING_PROVIDER=${{ vars.VITE_MONITORING_PROVIDER }}
          VITE_SENTRY_EXTENSION_DSN=${{ vars.VITE_SENTRY_EXTENSION_DSN }}
          VITE_SENTRY_ENVIRONMENT=production
          EOF

      - name: Build extension packages
        run: |
          pnpm nx run extension:build-chrome
          pnpm nx run extension:build-firefox

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find apps/extension -type f -name '*.zip' -print -exec cp {} artifacts/ \;
          if [ -z "$(ls -A artifacts)" ]; then
            echo '::error::No extension zip artifacts found after build'
            exit 1
          fi
          ls -la artifacts

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
