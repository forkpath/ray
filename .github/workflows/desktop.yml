name: Desktop checks
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Resolve hosted or self-hosted runners with the same validation as the CI selector.
  # In a reusable workflow, vars and the event context come from the calling run.
  runners:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runners: ${{ steps.resolve.outputs.runners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
      - id: resolve
        run: node scripts/ci/runners.mjs
        env:
          RAY_RUNNER_IOS: ${{ vars.RAY_RUNNER_IOS }}
          RAY_RUNNER_DESKTOP_MAC_ARM64: ${{ vars.RAY_RUNNER_DESKTOP_MAC_ARM64 }}
          RAY_RUNNER_DESKTOP_MAC_X64: ${{ vars.RAY_RUNNER_DESKTOP_MAC_X64 }}
          RAY_RUNNER_DESKTOP_WIN: ${{ vars.RAY_RUNNER_DESKTOP_WIN }}
          RAY_RUNNER_ANDROID: ${{ vars.RAY_RUNNER_ANDROID }}

  desktop:
    needs: runners
    strategy:
      fail-fast: false
      matrix:
        # `os` names the hosted image and the artifact; `runner` is where the job runs.
        include:
          - os: macos-15
            arch: arm64
            runner: ${{ fromJSON(needs.runners.outputs.runners).desktopMacArm64 }}
          - os: macos-15-intel
            arch: x64
            runner: ${{ fromJSON(needs.runners.outputs.runners).desktopMacX64 }}
          - os: windows-2025
            arch: x64
            runner: ${{ fromJSON(needs.runners.outputs.runners).desktopWin }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      NX_NO_CLOUD: 'true'
      DESKTOP_ARCH: ${{ matrix.arch }}
      VITE_URL: https://example.com
      VITE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint,typecheck,test,build -p desktop
      - run: pnpm nx run desktop:e2e
      - run: pnpm nx run desktop:smoke
      - run: pnpm nx run desktop:update-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-tests-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/desktop/test-results
          if-no-files-found: warn
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_NO_CLOUD: 'true'
      DESKTOP_S3_ENDPOINT: http://127.0.0.1:9000
      DESKTOP_S3_BUCKET: ray-desktop-test
      AWS_ACCESS_KEY_ID: ray-test
      AWS_SECRET_ACCESS_KEY: ray-test-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker run -d --name ray-minio -p 9000:9000 -e MINIO_ROOT_USER=ray-test -e MINIO_ROOT_PASSWORD=ray-test-password ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68 server /data
      - run: curl --retry 20 --retry-delay 1 --retry-all-errors --fail http://127.0.0.1:9000/minio/health/live
      - run: pnpm nx run desktop:publish-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-storage-tests
          path: dist/desktop/test-results/publish
          if-no-files-found: warn
