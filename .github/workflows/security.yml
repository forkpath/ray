name: Dependency security

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  schedule:
    - cron: '41 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      # Audit the workspace lockfile without installing packages or running
      # lifecycle scripts. Registry failures remain failures, not clean audits.
      - name: Audit locked dependencies using the official registry
        shell: bash
        run: node scripts/ci/audit-dependencies.mjs dependency-audit.json
      # Report-only: a newer upstream release prompts a review of the local patch.
      # Registry failures still fail the step instead of producing an empty report.
      - name: Check upstream releases for patched dependencies
        if: always()
        shell: bash
        run: node scripts/ci/check-patches.mjs dependency-patches.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-audit
          path: |
            dependency-audit.json
            dependency-audit-evaluation.json
            dependency-patches.json
          retention-days: 7
          if-no-files-found: error
