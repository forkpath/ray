name: Dependency security

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  schedule:
    - cron: '41 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
      # Audit the workspace lockfile without installing packages or running
      # lifecycle scripts. Registry failures remain failures, not clean audits.
      - name: Audit locked dependencies using the official registry
        shell: bash
        run: node scripts/ci/audit-dependencies.mjs dependency-audit.json
      # Report-only: a newer upstream release prompts a review of the local patch.
      # Registry failures still fail the step instead of producing an empty report.
      - name: Check upstream releases for patched dependencies
        if: always()
        shell: bash
        run: node scripts/ci/check-patches.mjs dependency-patches.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dependency-audit
          path: |
            dependency-audit.json
            dependency-audit-evaluation.json
            dependency-patches.json
          retention-days: 7
          if-no-files-found: error
