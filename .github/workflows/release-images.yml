name: Release Images

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  packages: write

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require main or a production tag from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            exit 0
          fi
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo '::error::Images can only be published from main or a v* tag'
            exit 1
          fi
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo '::error::Production tags must point to a commit on main'
            exit 1
          fi

  package:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package deterministic application outputs
        env:
          NODE_ENV: production
        run: |
          pnpm exec nx run-many -t package -p engine,pulse,worker --parallel=3 --outputStyle=static
          pnpm exec nx run web:package --outputStyle=static

      - name: Upload immutable image inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/apps/web
            dist/services/engine
            dist/services/pulse
            dist/services/worker
          if-no-files-found: error
          retention-days: 1

  build-image:
    needs: [verify-source, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: engine
            dockerfile: docker/engine.Dockerfile
          - service: migrator
            dockerfile: docker/migrator.Dockerfile
          - service: pulse
            dockerfile: docker/pulse.Dockerfile
          - service: web
            dockerfile: docker/web.Dockerfile
          - service: worker
            dockerfile: docker/worker.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download deterministic application outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-image-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: dist

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image names
        id: image
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ray-${SERVICE}"
          {
            echo "image=$image"
            echo 'tags<<EOF'
            echo "${image}:${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "${image}:${GITHUB_REF_NAME}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=release-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service }}
          provenance: mode=max
          sbom: true

      - name: Write image record
        env:
          RELEASE_SERVICE: ${{ matrix.service }}
          RELEASE_IMAGE: ${{ steps.image.outputs.image }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_GIT_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          mkdir -p artifacts/release-images
          node scripts/release/release-manifest.mjs record \
            --output=artifacts/release-images/${{ matrix.service }}.json

      - name: Upload image record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-${{ matrix.service }}-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release-images/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 90

  manifest:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Download image records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-image-*-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release-images
          merge-multiple: true

      - name: Assemble release manifest
        run: >-
          node scripts/release/release-manifest.mjs assemble
          --input=artifacts/release-images
          --output=artifacts/release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 90
