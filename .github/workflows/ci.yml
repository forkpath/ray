name: CI

on:
  push:
    branches:
      - dev
  pull_request:
  schedule:
    - cron: '23 18 * * 0'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      full:
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  select:
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      full: ${{ steps.suites.outputs.full }}
      base: ${{ steps.suites.outputs.base }}
      head: ${{ steps.suites.outputs.head }}
      backend: ${{ steps.suites.outputs.backend }}
      backendEnabled: ${{ steps.suites.outputs.backendEnabled }}
      extension: ${{ steps.suites.outputs.extension }}
      desktop: ${{ steps.suites.outputs.desktop }}
      web: ${{ steps.suites.outputs.web }}
      generator: ${{ steps.suites.outputs.generator }}
      bootstrap: ${{ steps.suites.outputs.bootstrap }}
      mobile: ${{ steps.suites.outputs.mobile }}
      mobileAndroid: ${{ steps.suites.outputs.mobileAndroid }}
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: suites
        run: node scripts/ci/select-test-suites.mjs
        env:
          CI_FULL: ${{ inputs.full }}

  main:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # GitHub resolves repository secrets to an empty string for fork PRs. This
    # keeps fork validation local while internal branches can use Nx Cloud.
    env:
      POSTGRES_DATABASE_URL: postgresql://schema:check@127.0.0.1:1/schema_check
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
      RAY_TEST_COVERAGE: 'true'
      NX_BASE: ${{ needs.select.outputs.base }}
      NX_HEAD: ${{ needs.select.outputs.head }}
      VITE_URL: https://example.invalid
      VITE_API_BASE_URL: http://127.0.0.1:8000
      CONTACT_EMAIL: framework@example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        name: Install pnpm
        with:
          run_install: false

      # Cache node_modules
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: 'pnpm'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - run: pnpm install --frozen-lockfile

      - name: Check repository formatting
        run: pnpm nx format:check --all

      - name: Validate runtime boundaries and cleanup safety
        run: pnpm ci:checks

      - name: Validate Nx cache inputs and side-effect exclusions
        run: pnpm ci:nx-cache-contracts

      - name: Validate all projects
        if: needs.select.outputs.full == 'true'
        run: pnpm nx run-many -t lint,typecheck,typecheck-tests,test,build --nxBail --outputStyle=static

      - name: Validate affected projects
        if: needs.select.outputs.full != 'true'
        run: pnpm nx affected -t lint,typecheck,typecheck-tests,test,build --nxBail --outputStyle=static

      - name: Validate database and auth contracts
        run: pnpm exec nx run-many -t validate,schema-check -p pg-dao,auth-server --nxBail

      - name: Prove Prisma generation does not mutate the auth contract
        run: |
          pnpm exec nx run pg-dao:generate
          git diff --exit-code -- libs/pg-dao/src/models/auth.prisma

      # Container parsing, Compose rendering, and entrypoint syntax are
      # deliberately outside Nx Cache because they protect release inputs.
      - name: Validate container contracts
        run: pnpm ci:container-contracts

      - name: Validate packaged runtime artifacts
        if: needs.select.outputs.full == 'true'
        run: |
          pnpm exec nx run-many -t package -p engine,pulse,worker --nxBail --skipNxCache
          bash scripts/ci/check-container-contracts.sh --require-artifacts

      - name: Build and run disposable release images
        if: needs.select.outputs.full == 'true'
        env:
          RAY_RELEASE_IMAGE_PREFIX: ray-ci
          RAY_RELEASE_IMAGE_TAG: ${{ needs.select.outputs.head }}
        run: |
          set -euo pipefail
          for service in engine web pulse worker migrator; do
            docker build --file "docker/$service.Dockerfile" --tag "$RAY_RELEASE_IMAGE_PREFIX/$service:$RAY_RELEASE_IMAGE_TAG" .
          done
          node scripts/testing/run-backend.mjs release artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fast-checks-and-builds
          path: |
            dist/test-results
            coverage
          if-no-files-found: warn

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always() && env.NX_NO_CLOUD != 'true'

  database-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:17@sha256:2203e6282d9e7de7c24d7da234e2a744fb325df366a3fd8ed940e8abbee39527
        env:
          POSTGRES_USER: ray_ci
          POSTGRES_PASSWORD: ray_ci_password
          POSTGRES_DB: ray_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ray_ci -d ray_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DATABASE_URL: postgresql://ray_ci:ray_ci_password@127.0.0.1:5432/ray_ci
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize the current schema in an empty database
        run: pnpm nx run pg-dao:deploy
      - name: Verify migration deployment is repeatable
        run: pnpm nx run pg-dao:deploy
      - name: Verify database matches the Prisma models
        run: pnpm nx run pg-dao:prisma -- migrate diff --from-config-datasource --to-schema=./src --exit-code

  backend:
    needs: select
    if: needs.select.outputs.backendEnabled == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.backend) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run ${{ matrix.project }}:test-integration
      - run: pnpm nx run ${{ matrix.project }}:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-${{ matrix.project }}
          path: dist/test-results/${{ matrix.project }}
          if-no-files-found: warn

  generator:
    needs: select
    if: needs.select.outputs.generator == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate both ownership variants and verify real HTTP and PostgreSQL
        run: pnpm nx run ray-plugin:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: generated-resources
          path: dist/test-results/ray-plugin
          if-no-files-found: error

  bootstrap:
    needs: select
    if: needs.select.outputs.bootstrap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: pnpm
      # bootstrap performs the frozen install itself, exactly as a new developer would.
      - name: Bootstrap a fresh Linux checkout and start the full stack
        run: bash scripts/ci/bootstrap-acceptance.sh dist/test-results/bootstrap
      - name: Stop development infrastructure
        if: always()
        run: test ! -f .env || pnpm docker:dev:down
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bootstrap-acceptance
          path: dist/test-results/bootstrap
          if-no-files-found: error

  extension:
    needs: select
    if: needs.select.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum pnpm nx run extension:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: extension-chromium
          path: dist/test-results/extension
          if-no-files-found: warn

  web:
    needs: select
    if: needs.select.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NX_NO_CLOUD: 'true'
      VITE_URL: http://localhost:4173
      VITE_API_BASE_URL: http://127.0.0.1:8000
      CONTACT_EMAIL: framework@example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify the production framework page
        run: pnpm nx run web-e2e:e2e --grep 'marketing application'
      - name: Record optional integration scope
        run: echo 'Provider/account business scenarios are not enabled in this framework page suite. Engine/Pulse/Worker use separate real isolated service suites.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-production-smoke
          path: |
            dist/.playwright
            dist/test-results/web-e2e
          if-no-files-found: warn

  mobile:
    needs: select
    if: needs.select.outputs.mobileAndroid == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.mobile) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: pnpm
      - name: Make room for the Android native build
        if: matrix.platform == 'android'
        run: |
          df -h . /tmp
          # This hosted Android job does not use the preinstalled .NET/Haskell/CodeQL tools.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          # Expo uses the exact NDK installed below; other hosted versions only consume disk.
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
          sudo find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d ! -name '27.1.12297006' -exec rm -rf {} +
          df -h . /tmp
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      # Native tools validate cached entries against their actual inputs. Do not
      # cache an APK/app, simulator state, credentials, or a test result.
      - name: Restore Android native dependencies and compilation cache
        if: matrix.platform == 'android'
        id: gradle-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/**/*.lock
            !~/.gradle/caches/**/gc.properties
          key: mobile-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/testing/mobile-tools.json') }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'apps/mobile/package.json', 'apps/mobile/app.config.ts', 'apps/mobile/eas.json', 'patches/**') }}
          restore-keys: |
            mobile-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/testing/mobile-tools.json') }}-
      - name: Restore iOS native dependencies and compilation cache
        if: matrix.platform == 'ios'
        id: ios-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/CocoaPods
            .cache/mobile-native/ios
          key: mobile-xcode-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/testing/mobile-tools.json') }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'apps/mobile/package.json', 'apps/mobile/app.config.ts', 'apps/mobile/eas.json', 'patches/**') }}
          restore-keys: |
            mobile-xcode-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/testing/mobile-tools.json') }}-
      - run: pnpm install --frozen-lockfile
      - run: node scripts/testing/install-maestro.mjs
      - name: Prepare Android device and native SDK
        if: matrix.platform == 'android'
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'system-images;android-36;google_apis;x86_64'
      - name: Select pinned Xcode and hosted simulator runtime
        if: matrix.platform == 'ios'
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs'
          const tools = JSON.parse(readFileSync('scripts/testing/mobile-tools.json', 'utf8'))
          appendFileSync(process.env.GITHUB_ENV, `DEVELOPER_DIR=/Applications/Xcode_${tools.xcodeVersion}.app/Contents/Developer\n`)
          JS
      - run: pnpm nx run mobile:e2e:${{ matrix.platform }}
      # A later device/flow failure must not discard a completed native build's
      # reusable cache. Never publish an incomplete first build as an exact hit.
      - name: Save Android cache after a completed native build
        if: ${{ !cancelled() && matrix.platform == 'android' && steps.gradle-cache.outputs.cache-hit != 'true' && hashFiles('dist/test-results/mobile/e2e/android/**/native-build.json') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/**/*.lock
            !~/.gradle/caches/**/gc.properties
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Save iOS cache after a completed native build
        if: ${{ !cancelled() && matrix.platform == 'ios' && steps.ios-cache.outputs.cache-hit != 'true' && hashFiles('dist/test-results/mobile/e2e/ios/**/native-build.json') != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/CocoaPods
            .cache/mobile-native/ios
          key: ${{ steps.ios-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-${{ matrix.platform }}
          path: |
            dist/test-results/mobile/e2e
            !dist/test-results/mobile/e2e/**/*.app/**
          if-no-files-found: warn

  desktop-checks:
    needs: select
    if: needs.select.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  required-checks:
    name: Required checks
    if: always()
    needs:
      [select, security, main, database-contract, backend, generator, bootstrap, extension, web, mobile, desktop-checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      - name: Require selected suites to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/required-checks.mjs

  deploy-staging:
    name: Deploy staging
    needs: required-checks
    # Optional suites can be skipped while the aggregate succeeds. Override the
    # implicit success() for skipped ancestors, but never deploy after failure
    # or cancellation.
    if: >-
      always() && !cancelled() && needs.required-checks.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/dev' && inputs.ref == ''
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      commit: ${{ github.sha }}
    secrets: inherit

  staging-deployment:
    name: Staging deployment
    needs: deploy-staging
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && inputs.ref == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the real staging deployment to succeed
        env:
          DEPLOYMENT_RESULT: ${{ needs.deploy-staging.result }}
        run: test "$DEPLOYMENT_RESULT" = success
