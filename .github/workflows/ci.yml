name: CI

# Branch policy (docs/development/branch-workflow.md):
# - pull requests into dev and arch are tested; labels may skip device suites;
# - pushes to dev (merged pull requests) run the full matrix, then deploy staging;
# - arch pushes run nothing; main is fast-forwarded to a staging-verified dev commit
#   and deployed by deploy.yml without re-running tests.
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - arch
  schedule:
    - cron: '23 18 * * 0'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      full:
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  # The selector reads the current pull request labels (ci:skip-*, ci:full).
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  select:
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      full: ${{ steps.suites.outputs.full }}
      base: ${{ steps.suites.outputs.base }}
      head: ${{ steps.suites.outputs.head }}
      backend: ${{ steps.suites.outputs.backend }}
      backendEnabled: ${{ steps.suites.outputs.backendEnabled }}
      extension: ${{ steps.suites.outputs.extension }}
      desktop: ${{ steps.suites.outputs.desktop }}
      web: ${{ steps.suites.outputs.web }}
      generator: ${{ steps.suites.outputs.generator }}
      bootstrap: ${{ steps.suites.outputs.bootstrap }}
      mobile: ${{ steps.suites.outputs.mobile }}
      mobileAndroid: ${{ steps.suites.outputs.mobileAndroid }}
      mobileEnabled: ${{ steps.suites.outputs.mobileEnabled }}
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: suites
        run: node scripts/ci/select-test-suites.mjs
        env:
          CI_FULL: ${{ inputs.full }}
          GITHUB_TOKEN: ${{ github.token }}
          # Optional self-hosted runners; see docs/development/self-hosted-runners.md.
          RAY_RUNNER_IOS: ${{ vars.RAY_RUNNER_IOS }}
          RAY_RUNNER_DESKTOP_MAC_ARM64: ${{ vars.RAY_RUNNER_DESKTOP_MAC_ARM64 }}
          RAY_RUNNER_DESKTOP_MAC_X64: ${{ vars.RAY_RUNNER_DESKTOP_MAC_X64 }}
          RAY_RUNNER_DESKTOP_WIN: ${{ vars.RAY_RUNNER_DESKTOP_WIN }}
          RAY_RUNNER_ANDROID: ${{ vars.RAY_RUNNER_ANDROID }}
          RAY_RUNNER_UNTRUSTED: ${{ vars.RAY_RUNNER_UNTRUSTED }}

  main:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # GitHub resolves repository secrets to an empty string for fork PRs. This
    # keeps fork validation local while internal branches can use Nx Cloud.
    env:
      POSTGRES_DATABASE_URL: postgresql://schema:check@127.0.0.1:1/schema_check
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
      RAY_TEST_COVERAGE: 'true'
      NX_BASE: ${{ needs.select.outputs.base }}
      NX_HEAD: ${{ needs.select.outputs.head }}
      VITE_URL: https://example.invalid
      VITE_API_BASE_URL: http://127.0.0.1:8000
      CONTACT_EMAIL: framework@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      # Cache node_modules
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          cache: 'pnpm'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - run: pnpm install --frozen-lockfile

      - name: Check repository formatting
        run: pnpm nx format:check --all

      - name: Validate runtime boundaries and cleanup safety
        run: pnpm ci:checks

      - name: Validate Nx cache inputs and side-effect exclusions
        run: pnpm ci:nx-cache-contracts

      - name: Validate all projects
        if: needs.select.outputs.full == 'true'
        run: pnpm nx run-many -t lint,typecheck,typecheck-tests,test,build --nxBail --outputStyle=static

      - name: Validate affected projects
        if: needs.select.outputs.full != 'true'
        run: pnpm nx affected -t lint,typecheck,typecheck-tests,test,build --nxBail --outputStyle=static

      - name: Validate database and auth contracts
        run: pnpm exec nx run-many -t validate,schema-check -p pg-dao,auth-server --nxBail

      - name: Prove Prisma generation does not mutate the auth contract
        run: |
          pnpm exec nx run pg-dao:generate
          git diff --exit-code -- libs/pg-dao/src/models/auth.prisma

      # Container parsing, Compose rendering, and entrypoint syntax are
      # deliberately outside Nx Cache because they protect release inputs.
      - name: Validate container contracts
        run: pnpm ci:container-contracts

      - name: Validate packaged runtime artifacts
        if: needs.select.outputs.full == 'true'
        run: |
          pnpm exec nx run-many -t package -p engine,pulse,worker --nxBail --skipNxCache
          bash scripts/ci/check-container-contracts.sh --require-artifacts

      - name: Build and run disposable release images
        if: needs.select.outputs.full == 'true'
        env:
          RAY_RELEASE_IMAGE_PREFIX: ray-ci
          RAY_RELEASE_IMAGE_TAG: ${{ needs.select.outputs.head }}
        run: |
          set -euo pipefail
          for service in engine web pulse worker migrator; do
            docker build --file "docker/$service.Dockerfile" --tag "$RAY_RELEASE_IMAGE_PREFIX/$service:$RAY_RELEASE_IMAGE_TAG" .
          done
          node scripts/testing/run-backend.mjs release artifact

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fast-checks-and-builds
          path: |
            dist/test-results
            coverage
          if-no-files-found: warn

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always() && env.NX_NO_CLOUD != 'true'

  database-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:17@sha256:2203e6282d9e7de7c24d7da234e2a744fb325df366a3fd8ed940e8abbee39527
        env:
          POSTGRES_USER: ray_ci
          POSTGRES_PASSWORD: ray_ci_password
          POSTGRES_DB: ray_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ray_ci -d ray_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DATABASE_URL: postgresql://ray_ci:ray_ci_password@127.0.0.1:5432/ray_ci
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize the current schema in an empty database
        run: pnpm nx run pg-dao:deploy
      - name: Verify migration deployment is repeatable
        run: pnpm nx run pg-dao:deploy
      - name: Verify database matches the Prisma models
        run: pnpm nx run pg-dao:prisma -- migrate diff --from-config-datasource --to-schema=./src --exit-code

  backend:
    needs: select
    if: needs.select.outputs.backendEnabled == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.backend) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run ${{ matrix.project }}:test-integration
      - run: pnpm nx run ${{ matrix.project }}:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: backend-${{ matrix.project }}
          path: dist/test-results/${{ matrix.project }}
          if-no-files-found: warn

  generator:
    needs: select
    if: needs.select.outputs.generator == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate both ownership variants and verify real HTTP and PostgreSQL
        run: pnpm nx run ray-plugin:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: generated-resources
          path: dist/test-results/ray-plugin
          if-no-files-found: error

  bootstrap:
    needs: select
    if: needs.select.outputs.bootstrap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
          cache: pnpm
      # bootstrap performs the frozen install itself, exactly as a new developer would.
      - name: Bootstrap a fresh Linux checkout and start the full stack
        run: bash scripts/ci/bootstrap-acceptance.sh dist/test-results/bootstrap
      - name: Stop development infrastructure
        if: always()
        run: test ! -f .env || pnpm docker:dev:down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bootstrap-acceptance
          path: dist/test-results/bootstrap
          if-no-files-found: error

  extension:
    needs: select
    if: needs.select.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum pnpm nx run extension:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: extension-chromium
          path: dist/test-results/extension
          if-no-files-found: warn

  web:
    needs: select
    if: needs.select.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NX_NO_CLOUD: 'true'
      VITE_URL: http://localhost:4173
      VITE_API_BASE_URL: http://127.0.0.1:8000
      CONTACT_EMAIL: framework@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify the production framework page
        run: pnpm nx run web-e2e:e2e --grep 'marketing application'
      - name: Record optional integration scope
        run: echo 'Provider/account business scenarios are not enabled in this framework page suite. Engine/Pulse/Worker use separate real isolated service suites.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: web-production-smoke
          path: |
            dist/.playwright
            dist/test-results/web-e2e
          if-no-files-found: warn

  mobile:
    needs: select
    if: needs.select.outputs.mobileEnabled == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.mobile) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
          # Self-hosted runners keep their pnpm store on disk; restoring a copy only costs time.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - name: Make room for the Android native build
        if: matrix.platform == 'android' && runner.environment == 'github-hosted'
        run: |
          df -h . /tmp
          # This hosted Android job does not use the preinstalled .NET/Haskell/CodeQL tools.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          # Expo uses the exact NDK installed below; other hosted versions only consume disk.
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
          sudo find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d ! -name '27.1.12297006' -exec rm -rf {} +
          df -h . /tmp
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # Native tools validate cached entries against their actual inputs. Do not
      # cache an APK/app, simulator state, credentials, or a test result.
      # Self-hosted runners keep these caches on disk instead: Gradle and CocoaPods in the
      # runner account's home, Maestro and the Xcode compilation cache under RAY_CI_CACHE_DIR
      # (outside the checkout, which actions/checkout cleans before every job).
      - name: Use the self-hosted runner's persistent caches
        if: runner.environment == 'self-hosted'
        run: |
          cache="${RAY_CI_CACHE_DIR:-$HOME/.cache/ray-ci}"
          mkdir -p "$cache"
          echo "RAY_TESTING_TOOLS_DIR=$cache/testing-tools" >> "$GITHUB_ENV"
          echo "RAY_MOBILE_NATIVE_CACHE_DIR=$cache/mobile-native" >> "$GITHUB_ENV"
          node scripts/ci/check-free-space.mjs "$cache"
      - name: Restore Android native dependencies and compilation cache
        if: matrix.platform == 'android' && runner.environment == 'github-hosted'
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/**/*.lock
            !~/.gradle/caches/**/gc.properties
          key: mobile-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/testing/mobile-tools.json') }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'apps/mobile/package.json', 'apps/mobile/app.config.ts', 'apps/mobile/eas.json', 'patches/**') }}
          restore-keys: |
            mobile-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/testing/mobile-tools.json') }}-
      - name: Restore iOS native dependencies and compilation cache
        if: matrix.platform == 'ios' && runner.environment == 'github-hosted'
        id: ios-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            .cache/mobile-native/ios
          # Hosted and self-hosted Macs run different macOS versions; keep their caches apart.
          key: mobile-xcode-v1-${{ runner.environment }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/testing/mobile-tools.json') }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'apps/mobile/package.json', 'apps/mobile/app.config.ts', 'apps/mobile/eas.json', 'patches/**') }}
          restore-keys: |
            mobile-xcode-v1-${{ runner.environment }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/testing/mobile-tools.json') }}-
      - run: pnpm install --frozen-lockfile
      - run: node scripts/testing/install-maestro.mjs
      - name: Prepare Android device and native SDK
        if: matrix.platform == 'android'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          ABI: ${{ runner.arch == 'ARM64' && 'arm64-v8a' || 'x86_64' }}
        run: |
          # Self-hosted runners set ANDROID_HOME in the runner's .env to an SDK the runner account owns.
          test -n "$ANDROID_HOME"
          if [ "$RUNNER_OS" = Linux ]; then
            test -e /dev/kvm
            if [ "$HOSTED" = true ]; then sudo chmod a+rw /dev/kvm; fi
          fi
          # Installed packages are left as they are; only missing ones are downloaded.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' "system-images;android-36;google_atd;$ABI"
      - name: Select pinned Xcode and simulator runtime
        if: matrix.platform == 'ios'
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const tools = JSON.parse(readFileSync('scripts/testing/mobile-tools.json', 'utf8'))
          // Hosted images install every Xcode as Xcode_<version>.app; a self-hosted Mac may keep
          // the pinned version as its only Xcode.app. Accept a path only if its version matches.
          const candidates = [`Xcode_${tools.xcodeVersion}.app`, `Xcode-${tools.xcodeVersion}.app`, 'Xcode.app']
          const version = app =>
            execFileSync('plutil', ['-extract', 'CFBundleShortVersionString', 'raw', `/Applications/${app}/Contents/version.plist`], {
              encoding: 'utf8'
            }).trim()
          const app = candidates.find(name => existsSync(`/Applications/${name}`) && version(name) === tools.xcodeVersion)
          if (!app) throw new Error(`Pinned Xcode ${tools.xcodeVersion} not found as /Applications/{${candidates.join(',')}}`)
          appendFileSync(process.env.GITHUB_ENV, `DEVELOPER_DIR=/Applications/${app}/Contents/Developer\n`)
          console.log(`Using /Applications/${app}`)
          JS
      - run: pnpm nx run mobile:e2e:${{ matrix.platform }}
      # A later device/flow failure must not discard a completed native build's
      # reusable cache. Never publish an incomplete first build as an exact hit.
      - name: Save Android cache after a completed native build
        if: ${{ !cancelled() && runner.environment == 'github-hosted' && matrix.platform == 'android' && steps.gradle-cache.outputs.cache-hit != 'true' && hashFiles('dist/test-results/mobile/e2e/android/**/native-build.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/**/*.lock
            !~/.gradle/caches/**/gc.properties
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Save iOS cache after a completed native build
        if: ${{ !cancelled() && runner.environment == 'github-hosted' && matrix.platform == 'ios' && steps.ios-cache.outputs.cache-hit != 'true' && hashFiles('dist/test-results/mobile/e2e/ios/**/native-build.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            .cache/mobile-native/ios
          key: ${{ steps.ios-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mobile-${{ matrix.platform }}
          path: |
            dist/test-results/mobile/e2e
            !dist/test-results/mobile/e2e/**/*.app/**
          if-no-files-found: warn

  desktop-checks:
    needs: select
    if: needs.select.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  required-checks:
    name: Required checks
    if: always()
    needs:
      [select, security, main, database-contract, backend, generator, bootstrap, extension, web, mobile, desktop-checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
      - name: Require selected suites to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/required-checks.mjs

  deploy-staging:
    name: Deploy staging
    needs: required-checks
    # Optional suites can be skipped while the aggregate succeeds. Override the
    # implicit success() for skipped ancestors, but never deploy after failure
    # or cancellation.
    if: >-
      always() && !cancelled() && needs.required-checks.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/dev' && inputs.ref == ''
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      commit: ${{ github.sha }}
    secrets: inherit

  staging-deployment:
    name: Staging deployment
    needs: deploy-staging
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && inputs.ref == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The main-gate ruleset requires the "Staging verified" commit status before main can be
    # fast-forwarded to this commit. A skipped job reports success for required checks, so the
    # gate uses a status that only this dev-push job ever writes. The newest status wins, so a
    # failed deployment followed by a successful re-run ends as success.
    permissions:
      statuses: write
    steps:
      - name: Record whether staging verified this commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_RESULT: ${{ needs.deploy-staging.result }}
          STATUS_URL: repos/${{ github.repository }}/statuses/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [ "$DEPLOYMENT_RESULT" = success ]; then state=success; fi
          gh api -X POST "$STATUS_URL" -f state="$state" -f context='Staging verified' \
            -f description="Staging deployment: $DEPLOYMENT_RESULT" -f target_url="$RUN_URL"
      - name: Require the real staging deployment to succeed
        env:
          DEPLOYMENT_RESULT: ${{ needs.deploy-staging.result }}
        run: test "$DEPLOYMENT_RESULT" = success
