name: Release Desktop
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop-vX.Y.Z tag matching desktop/package.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-stable-release
  cancel-in-progress: false
jobs:
  package:
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2025
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NX_NO_CLOUD: 'true'
      DESKTOP_ARCH: ${{ matrix.arch }}
      DESKTOP_UPDATE_BASE_URL: ${{ vars.DESKTOP_UPDATE_BASE_URL }}
      DESKTOP_WIN_PUBLISHER: ${{ vars.DESKTOP_WIN_PUBLISHER }}
      CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.DESKTOP_WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      VITE_URL: ${{ vars.VITE_URL }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_API_ENDPOINT: ${{ vars.VITE_API_ENDPOINT }}
      VITE_SENTRY_DESKTOP_DSN: ${{ vars.VITE_SENTRY_DESKTOP_DSN }}
      VITE_SENTRY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint,typecheck,test,build -p desktop
      - name: Build signed and notarized installers
        shell: bash
        env:
          DESKTOP_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          export GITHUB_REF="refs/tags/$DESKTOP_RELEASE_TAG"
          pnpm nx run desktop:release
      - name: Verify signed packaged runtime
        run: pnpm nx run desktop:smoke --excludeTaskDependencies
        env:
          DESKTOP_SMOKE_PROFILE: release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/release/*/*/Ray-*.dmg
            dist/desktop/release/*/*/Ray-*.zip
            dist/desktop/release/*/*/Ray-*.exe
            dist/desktop/release/*/*/Ray-*.blockmap
            dist/desktop/release/*/*/latest*.yml
            dist/desktop/release/*/*/release.json
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: desktop-release
    timeout-minutes: 30
    env:
      NX_NO_CLOUD: 'true'
      DESKTOP_UPDATE_BASE_URL: ${{ vars.DESKTOP_UPDATE_BASE_URL }}
      DESKTOP_S3_ENDPOINT: ${{ vars.DESKTOP_S3_ENDPOINT }}
      DESKTOP_S3_REGION: ${{ vars.DESKTOP_S3_REGION }}
      DESKTOP_S3_BUCKET: ${{ vars.DESKTOP_S3_BUCKET }}
      DESKTOP_S3_PREFIX: ${{ vars.DESKTOP_S3_PREFIX }}
      DESKTOP_S3_PATH_STYLE: ${{ vars.DESKTOP_S3_PATH_STYLE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: desktop-release-*
          path: dist/desktop/release
          merge-multiple: true
      - name: Upload verified artifacts, then promote update manifests
        env:
          DESKTOP_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          export GITHUB_REF="refs/tags/$DESKTOP_RELEASE_TAG"
          pnpm nx run desktop:publish
